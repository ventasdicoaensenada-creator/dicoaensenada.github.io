<!DOCTYPE html>
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#1a2744">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DICOA">

<script>
  // Registrar Service Worker (para offline)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
    html, body { height: 100%; margin: 0; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: #1a2744;
      min-height: 100vh;
    }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<!-- ESTO TAMBIÉN ES IMPORTANTE -->
<body class="min-h-screen text-white flex flex-col">
  <div id="app" class="flex-1">
    <div id="loader" class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-lg">Cargando clientes...</p>
      </div>
    </div>
  </div>

  <script>
    const SHEET_API = 'https://sheetdb.io/api/v1/m2kpg76ucwvd0?sheet=Clientes';
    let clientes = [];
    let editando = null;

    async function cargarClientes() {
      try {
        const res = await fetch(SHEET_API);
        if (!res.ok) throw new Error('Error SheetDB');
        const data = await res.json();
        clientes = data.filter(c => c.empresa && c.empresa.trim() !== '');
      } catch (err) {
        console.error(err);
        alert('Error al cargar clientes. Revisa tu conexión.');
        clientes = [];
      } finally {
        render();   // Aquí está la clave: siempre se llama render()
      }
    }

    async function guardarEnSheets(cliente) {
      const res = await fetch(SHEET_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: cliente })
      });
      return res.ok;
    }

    async function actualizarEnSheets(nombreViejo, clienteNuevo) {
      const del = await fetch(`${SHEET_API}/empresa/${encodeURIComponent(nombreViejo)}`, { method: 'DELETE' });
      if (del.ok) return await guardarEnSheets(clienteNuevo);
      return false;
    }

    async function eliminarDeSheets(nombre) {
      const res = await fetch(`${SHEET_API}/empresa/${encodeURIComponent(nombre)}`, { method: 'DELETE' });
      return res.ok;
    }

    function render() {
      // QUITAR LA PANTALLA DE CARGA
      const loader = document.getElementById('loader');
      if (loader) loader.remove();

      const filas = clientes.length === 0
        ? `<tr><td colspan="7" class="text-center py-20 text-gray-400 text-xl">No hay clientes registrados aún</td></tr>`
        : clientes.map(c => `
          <tr class="hover:bg-white/10 transition">
            <td class="py-5 px-6 font-bold text-lg">${c.empresa || '-'}</td>
            <td class="py-5 px-6">${(c.usuarios || '-').replace(/,/g, '<br>')}</td>
            <td class="py-5 px-6">${c.telefono || '-'}</td>
            <td class="py-5 px-6">${c.correo || '-'}</td>
            <td class="py-5 px-6">${c.ciudad || 'Ensenada'}</td>
            <td class="py-5 px-6 text-center">
              <span class="px-4 py-2 rounded-full text-xs font-bold uppercase
                ${c.estado === 'activo' ? 'bg-green-900/60 text-green-300' : 
                  c.estado === 'potencial' ? 'bg-yellow-900/60 text-yellow-300' : 
                  'bg-red-900/60 text-red-300'}">
                ${c.estado || 'activo'}
              </span>
            </td>
            <td class="py-5 px-6 text-center space-x-4">
              <button onclick="editar('${c.empresa}')" class="text-cyan-400 hover:text-cyan-300 font-medium">Editar</button>
              <button onclick="eliminar('${c.empresa}')" class="text-red-400 hover:text-red-300 font-medium">Eliminar</button>
            </td>
          </tr>
        `).join('');

      document.getElementById('app').innerHTML = `
     
        <!-- HEADER -->
        <div class="pt-8 pb-6 px-6 border-b border-white/10">
          <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <a href="index.html" class="inline-flex items-center gap-3 text-white hover:bg-white/10 px-5 py-3 rounded-xl transition">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
              <span class="font-bold">Volver</span>
            </a>
            <h1 class="text-4xl font-black">Agenda de Clientes</h1>
            <div class="text-cyan-300 font-bold">${clientes.length} usuarios</div>
          </div>
        </div>

        <!-- MAIN -->
        <div class="px-6 py-10">
          <div class="max-w-6xl mx-auto">
            <button onclick="nuevoCliente()" class="mb-8 px-10 py-5 bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 rounded-2xl font-black text-xl shadow-2xl transition transform hover:scale-105">
              + Nueva Empresa
            </button>

            <div class="bg-white/10 backdrop-blur-xl rounded-3xl overflow-hidden border border-white/20 shadow-2xl">
              <table class="w-full">
                <thead class="bg-white/5">
                  <tr>
                    <th class="text-left py-6 px-6 font-black text-cyan-300">Empresa</th>
                    <th class="text-left py-6 px-6 font-black text-cyan-300">Contactos</th>
                    <th class="text-left py-6 px-6 font-black text-cyan-300">Teléfono</th>
                    <th class="text-left py-6 px-6 font-black text-cyan-300">Correo</th>
                    <th class="text-left py-6 px-6 font-black text-cyan-300">Ciudad</th>
                    <th class="text-left py-6 px-6 font-black text-cyan-300">Estado</th>
                    <th class="text-center py-6 px-6 font-black text-cyan-300">Acciones</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/10">
                  ${filas}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- MODAL -->
        <div id="modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50 p-4">
          <div class="bg-slate-900 rounded-3xl p-8 max-w-2xl w-full shadow-2xl border border-white/20">
            <h2 class="text-3xl font-black mb-8 text-center">${editando ? 'Editar Empresa' : 'Nueva Empresa'}</h2>
            <div class="space-y-6">
              <input type="text" id="empresa" placeholder="Nombre de la empresa *" class="w-full px-6 py-4 bg-white/10 border border-white/20 rounded-xl focus:outline-none focus:ring-4 focus:ring-cyan-500/60 text-lg font-medium">
              <textarea id="usuarios" rows="4" placeholder="Contactos (uno por línea o separados por coma)" class="w-full px-6 py-4 bg-white/10 border border-white/20 rounded-xl focus:outline-none focus:ring-4 focus:ring-cyan-500/60 resize-none"></textarea>
              <div class="grid grid-cols-2 gap-6">
                <input type="text" id="telefono" placeholder="Teléfono" class="px-6 py-4 bg-white/10 border border-white/20 rounded-xl">
                <input type="email" id="correo" placeholder="Correo electrónico" class="px-6 py-4 bg-white/10 border border-white/20 rounded-xl">
              </div>
              <div class="grid grid-cols-2 gap-6">
                <input type="text" id="ciudad" placeholder="Ciudad" value="Ensenada" class="px-6 py-4 bg-white/10 border border-white/20 rounded-xl">
                <select id="estado" class="px-6 py-4 bg-white/10 border border-white/20 rounded-xl text-white">
                  <option value="activo">Activo</option>
                  <option value="potencial">Potencial</option>
                  <option value="inactivo">Inactivo</option>
                </select>
              </div>
              <div class="flex gap-6 mt-10">
                <button onclick="guardar()" class="flex-1 py-5 bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 rounded-xl font-black text-xl shadow-xl transition transform hover:scale-105">
                  Guardar
                </button>
                <button onclick="cerrarModal()" class="px-10 py-5 bg-white/10 hover:bg-white/20 rounded-xl font-bold">
                  Cancelar
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      if (editando) abrirModal(editando);
    }

    function nuevoCliente() {
      editando = null;
      document.getElementById('empresa').value = '';
      document.getElementById('usuarios').value = '';
      document.getElementById('telefono').value = '';
      document.getElementById('correo').value = '';
      document.getElementById('ciudad').value = 'Ensenada';
      document.getElementById('estado').value = 'activo';
      document.getElementById('modal').classList.remove('hidden');
    }

    function editar(nombre) {
      const c = clientes.find(x => x.empresa === nombre);
      if (!c) return;
      editando = nombre;
      document.getElementById('empresa').value = c.empresa || '';
      document.getElementById('usuarios').value = c.usuarios || '';
      document.getElementById('telefono').value = c.telefono || '';
      document.getElementById('correo').value = c.correo || '';
      document.getElementById('ciudad').value = c.ciudad || 'Ensenada';
      document.getElementById('estado').value = c.estado || 'activo';
      document.getElementById('modal').classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.add('hidden');
      editando = null;
    }

    async function guardar() {
      const datos = {
        empresa: document.getElementById('empresa').value.trim(),
        usuarios: document.getElementById('usuarios').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        ciudad: document.getElementById('ciudad').value.trim() || 'Ensenada',
        estado: document.getElementById('estado').value
      };

      if (!datos.empresa) return alert('El nombre de la empresa es obligatorio');

      let exito = false;
      if (editando) {
        exito = await actualizarEnSheets(editando, datos);
      } else {
        exito = await guardarEnSheets(datos);
      }

      if (exito) {
        cerrarModal();
        await cargarClientes();
      } else {
        alert('Error al guardar');
      }
    }

    async function eliminar(nombre) {
      if (!confirm(`¿Eliminar permanentemente "${nombre}"?`)) return;
      const ok = await eliminarDeSheets(nombre);
      if (ok) await cargarClientes();
      else alert('Error al eliminar');
    }

    // INICIAR
    cargarClientes();
  </script>
</body>
</html>
